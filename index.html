<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Favicon chain (all browsers + mobile) ──────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- ─── Web App Manifest (PWA / Add to Home Screen) ────────────────── -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ─── Address bar color (mobile Chrome/Edge/Safari) ──────────────── -->
    <meta name="theme-color" content="#863bff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SinovexAI" />
    <meta name="application-name" content="SinovexAI" />
    <meta name="msapplication-TileColor" content="#863bff" />

    <!-- ─── SEO ────────────────────────────────────────────────────────── -->
    <title>SinovexAI — AI Systems for Modern Businesses</title>
    <meta
      name="description"
      content="SinovexAI builds premium AI WhatsApp bots, website AI assistants, AI voice systems, and business automation for companies in Sri Lanka and beyond."
    />
    <meta name="author" content="SinovexAI" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sinovexai.com" />

    <!-- ─── Open Graph (Facebook, LinkedIn, WhatsApp) ──────────────────── -->
    <meta property="og:site_name" content="SinovexAI" />
    <meta property="og:title" content="SinovexAI — AI Systems for Modern Businesses" />
    <meta
      property="og:description"
      content="Premium AI WhatsApp bots, website assistants, voice AI systems, and business automation. Built for Sri Lankan and global businesses."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sinovexai.com" />
    <meta property="og:image" content="https://sinovexai.com/favicon.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- ─── Twitter Card ───────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SinovexAI — AI Systems for Modern Businesses" />
    <meta
      name="twitter:description"
      content="AI WhatsApp bots, website assistants, voice systems, and automation for modern companies."
    />
    <meta name="twitter:image" content="https://sinovexai.com/favicon.svg" />

    <!-- ─── Google Fonts ───────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>

  <body>

</html>
